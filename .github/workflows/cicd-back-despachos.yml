- name: Deploy con Docker Compose
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_BACK_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "echo \"version: '"'3.8'"'
services:
  db-mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: despacho_db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - '"'3306:3306'"'
  back-ventas:
    image: ${{ secrets.ECR_REPO_VENTAS }}:latest
    depends_on:
      - db-mysql
    ports:
      - '"'8081:8080'"'
    environment:
      - DB_ENDPOINT=db-mysql
      - DB_PORT=3306
      - DB_NAME=despacho_db
      - DB_USERNAME=root
      - DB_PASSWORD=root_password\" > docker-compose.yml",
              "docker-compose up -d"
            ]}'