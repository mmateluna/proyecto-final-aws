name: CI/CD - Backend Despachos

on:
  push:
    branches: [deploy]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push Despachos
        run: |
          docker build -t back-despachos ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker tag back-despachos:latest ${{ secrets.ECR_REPO_DESPACHOS }}:latest
          docker push ${{ secrets.ECR_REPO_DESPACHOS }}:latest

      - name: Deploy en EC2 Backend
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_BACK_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "docker network create proyecto-net 2>/dev/null || true",
              "docker start mysql-despachos 2>/dev/null || docker run -d --name mysql-despachos --network proyecto-net -e MYSQL_ROOT_PASSWORD=rootpassword -e MYSQL_DATABASE=despachos_db mysql:8.0",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "docker pull ${{ secrets.ECR_REPO_DESPACHOS }}:latest",
              "docker stop despachos-container || true",
              "docker rm despachos-container || true",
              "docker run -d --name despachos-container --network proyecto-net --restart unless-stopped -p 8082:8080 ${{ secrets.ECR_REPO_DESPACHOS }}:latest"
            ]}'
