# Stack: Ventas + Despachos + MySQL + Frontend
# Uso local: docker compose up -d --build

services:
  mysql-ventas:
    image: mysql:8.0
    container_name: mysql-ventas
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ventas_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_ventas_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  mysql-despachos:
    image: mysql:8.0
    container_name: mysql-despachos
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: despachos_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_despachos_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  back-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: Dockerfile
    container_name: ventas-container
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      DB_ENDPOINT: mysql-ventas
      DB_PORT: "3306"
      DB_NAME: ventas_db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    depends_on:
      mysql-ventas:
        condition: service_healthy

  back-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: Dockerfile
    container_name: despachos-container
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      DB_ENDPOINT: mysql-despachos
      DB_PORT: "3306"
      DB_NAME: despachos_db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    depends_on:
      mysql-despachos:
        condition: service_healthy

  frontend:
    build:
      context: ./front_despacho
      dockerfile: Dockerfile
    container_name: front-container
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - back-ventas
      - back-despachos

volumes:
  mysql_ventas_data:
  mysql_despachos_data:
